[build-system]
requires = ["setuptools>=68,<83"]
build-backend = "setuptools.build_meta"

[project]
name = "barca-possession-hack"
version = "1.0.0"
license = "MIT"
description = "Frame-level ball possession (H/A/D) from automatic tracking - More than a Hack 2027, team Visca Barca"
readme = "README.md"
requires-python = ">=3.13,<3.14"
# Pinned to the versions installed in the M1 venv (Python 3.13.0). The official scorer needs only numpy + pandas.
dependencies = ["numpy==2.5.4", "pandas==3.0.6"]

[project.optional-dependencies]
dev = ["pytest==9.1.1"]
c3 = ["lightgbm==4.7.0", "optuna==5.0.0", "scipy==1.18.1", "scikit-learn==1.9.1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib"
